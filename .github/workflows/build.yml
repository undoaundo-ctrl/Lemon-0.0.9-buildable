name: Build jar
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8.0.282'   # older Java 8 build

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean setupDecompWorkspace --refresh-dependencies
          ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: build/libs/*.jar
      
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean setupCiWorkspace
          ./gradlew build -x getAssets -x getAssetIndex
